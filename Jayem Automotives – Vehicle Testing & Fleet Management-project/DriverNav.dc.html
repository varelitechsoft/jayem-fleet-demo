<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app bottom navigation</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Driver app" style="width: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #e8e6e5; background: #ffffff; padding: 6px 4px 10px; font-family: Inter, system-ui, sans-serif">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
    <a href="{{t.href}}" aria-current="{{t.cur}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 500; color: {{t.color}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
      {{t.label}}
      <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; top: 2px; left: 54%; min-width: 16px; height: 16px; border-radius: 9999px; background: #c2410c; color: #ffffff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{t.badge}}</span>
      </sc-if>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"Home","options":["Home","My Trips","My Tickets","Alerts","Profile"]},"$preview":{"width":390,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Home';
    const t = (label, href, d, badge) => ({ label, href, d, badge: badge || null, color: label === a ? '#c2410c' : '#78716c', cur: label === a ? 'page' : 'false' });
    return {
      tabs: [
        t('Home', 'Driver-Home.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'),
        t('My Trips', 'Driver-MyTrips.dc.html', 'M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 15V9a4 4 0 0 1 4-4h6M18 9v6a4 4 0 0 1-4 4H8'),
        t('My Tickets', 'Driver-MyTickets.dc.html', 'M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4zM10 5v14'),
        t('Alerts', 'Driver-Notifications.dc.html', 'M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8zM10 20a2 2 0 0 0 4 0', '3'),
        t('Profile', 'Driver-Profile.dc.html', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0')
      ]
    };
  }
}
</script>
</body>
</html>
