<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app – Pre-trip inspection</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#c2410c}a:hover{color:#9a3412}button,input{font-family:inherit}button{cursor:pointer}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafaf9; font-family: Inter, system-ui, sans-serif; color: #0c0a09; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 10px; background: #ffffff; border-bottom: 1px solid #e8e6e5">
    <a href="Driver-Assignment.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0c0a09"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; line-height: 1.25"><h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 19px">Start trip</h1><span style="font-size: 12px; color: #78716c">TN 09 AB 4521 · {{doneCount}} of 4 steps done</span></div>
  </header>

  <sc-if value="{{started}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center">
      <span style="width: 76px; height: 76px; border-radius: 9999px; background: #ecfdf3; color: #15803d; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      <h2 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 24px">Trip started</h2>
      <p style="margin: 0; color: #57534e">Started at 07:14 with odometer <strong style="color: #0c0a09">{{odo}} km</strong>. GPS tracking is on. Your supervisor can now see you live.</p>
      <a href="Driver-Trip.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; border-radius: 9999px; background: #c2410c; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; margin-top: 8px">Open live trip</a>
    </div>
  </sc-if>

  <sc-if value="{{notStarted}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <section style="background: #ffffff; border: 1px solid {{photoBorder}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 600">1. Odometer photo <span style="color: #b91c1c">*</span></span>
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 12px; align-items: center">
            <div role="img" aria-label="Captured odometer photo" style="width: 120px; height: 76px; border-radius: 8px; background: #1c1917; color: #fdba8c; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 16px; letter-spacing: 1px">018432.4</div>
            <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; color: #15803d; font-weight: 600">✓ Photo added</span><button type="button" onClick="{{retake}}" style="border: 0; background: transparent; padding: 0; color: #c2410c; font-size: 13px; font-weight: 500; text-align: left">Retake</button></div>
          </div>
        </sc-if>
        <sc-if value="{{noPhoto}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button type="button" onClick="{{capture}}" style="height: 76px; border: 1px dashed #a8a29e; border-radius: 10px; background: #fafaf9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; color: #0c0a09">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>Take photo</button>
            <button type="button" onClick="{{capture}}" style="height: 76px; border: 1px dashed #a8a29e; border-radius: 10px; background: #fafaf9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; color: #0c0a09">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>Upload</button>
          </div>
        </sc-if>
      </section>

      <section style="background: #ffffff; border: 1px solid {{odoBorder}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">2. Odometer reading (km) <span style="font-weight: 400; color: #78716c; font-size: 12px">Last recorded: 18,432.4</span>
          <input inputmode="decimal" value="{{odo}}" onInput="{{onOdo}}" placeholder="e.g. 18432.4" style="height: 50px; border: 1px solid #d6d3d1; border-radius: 10px; padding: 0 14px; font-size: 18px; font-weight: 500; color: #0c0a09">
        </label>
        <sc-if value="{{odoErr}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 12.5px; color: #b91c1c">{{odoErr}}</span></sc-if>
      </section>

      <section style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600">3. Vehicle condition</span>
        <sc-for list="{{checks}}" as="c" hint-placeholder-count="6">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 22px; height: 22px; accent-color: #c2410c">{{c.label}}</label>
        </sc-for>
      </section>

      <section style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 600">4. Ready to go</span>
        <label style="display: flex; align-items: center; gap: 12px; font-size: 14px"><input type="checkbox" checked="{{ready}}" onChange="{{toggleReady}}" style="width: 22px; height: 22px; accent-color: #c2410c">Vehicle is available and ready for testing</label>
        <button type="button" onClick="{{toggleGps}}" aria-pressed="{{gpsPressed}}" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid {{gpsBorder}}; background: {{gpsBg}}; color: #0c0a09; font-size: 14px; font-weight: 500">
          <span style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>GPS tracking</span>
          <span style="font-size: 13px; font-weight: 600; color: {{gpsColor}}">{{gpsLabel}}</span>
        </button>
      </section>
    </div>
    <div style="padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid #e8e6e5; display: flex; flex-direction: column; gap: 6px">
      <sc-if value="{{blockMsg}}" hint-placeholder-val="{{false}}"><span style="font-size: 12.5px; color: #78716c; text-align: center">{{blockMsg}}</span></sc-if>
      <button type="button" onClick="{{start}}" aria-disabled="{{disabledAttr}}" style="height: 54px; border-radius: 9999px; border: 0; background: {{startBg}}; color: {{startColor}}; font-size: 15px; font-weight: 600; letter-spacing: 0.3px">START TRIP</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { photo: false, odo: '', checks: [true, true, true, false, false, false], ready: false, gps: false, started: false, tried: false };
  }
  renderVals() {
    const s = this.state;
    const labels = ['Tyres and wheels OK', 'Lights and indicators work', 'Brakes feel normal', 'No warning lights on cluster', 'Mirrors, wipers, horn OK', 'Charging cable and kit on board'];
    const checks = labels.map((label, i) => ({ label, on: s.checks[i], toggle: () => { const c = s.checks.slice(); c[i] = !c[i]; this.setState({ checks: c }); } }));
    const n = parseFloat(s.odo);
    let odoErr = '';
    if (s.odo && (isNaN(n))) odoErr = 'Enter numbers only.';
    else if (s.odo && n < 18432.4) odoErr = 'Reading is lower than the last recorded 18,432.4 km. Ask your supervisor for an authorised correction.';
    const odoOk = !!s.odo && !odoErr;
    const allChecks = s.checks.every(Boolean);
    const steps = [s.photo, odoOk, allChecks, s.ready && s.gps];
    const ok = steps.every(Boolean);
    const missing = [];
    if (!s.photo) missing.push('odometer photo'); if (!odoOk) missing.push('reading'); if (!allChecks) missing.push('checklist'); if (!s.ready) missing.push('readiness'); if (!s.gps) missing.push('GPS');
    return {
      checks, odo: s.odo, odoErr, hasPhoto: s.photo, noPhoto: !s.photo, ready: s.ready,
      doneCount: steps.filter(Boolean).length, started: s.started, notStarted: !s.started,
      photoBorder: s.tried && !s.photo ? '#b91c1c' : '#e8e6e5', odoBorder: s.tried && !odoOk ? '#b91c1c' : '#e8e6e5',
      gpsPressed: s.gps ? 'true' : 'false', gpsBg: s.gps ? '#ecfdf3' : '#ffffff', gpsBorder: s.gps ? '#a7e3bd' : '#d6d3d1', gpsColor: s.gps ? '#15803d' : '#78716c', gpsLabel: s.gps ? 'ON · signal good' : 'Tap to turn on',
      startBg: ok ? '#c2410c' : '#e7e5e4', startColor: ok ? '#ffffff' : '#78716c', disabledAttr: ok ? 'false' : 'true',
      blockMsg: ok ? '' : 'Still needed: ' + missing.join(', '),
      capture: () => this.setState({ photo: true }), retake: () => this.setState({ photo: false }),
      onOdo: e => this.setState({ odo: e.target.value }),
      toggleReady: () => this.setState({ ready: !s.ready }), toggleGps: () => this.setState({ gps: !s.gps }),
      start: () => ok ? this.setState({ started: true }) : this.setState({ tried: true })
    };
  }
}
</script>
</body>
</html>
