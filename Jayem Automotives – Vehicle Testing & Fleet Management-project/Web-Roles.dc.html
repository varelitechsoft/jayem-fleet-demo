<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jayem Fleet Portal – Roles &amp; Permissions</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#fafaf9}a{color:#c2410c}a:hover{color:#9a3412}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #0c0a09; background: #fafaf9; min-height: 100vh; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.5">
  <div style="flex: 1 1 248px; max-width: 100%; background: #0f1c36"><dc-import name="Sidebar" active="Roles &amp; Permissions" hint-size="100%,1100px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Topbar" hint-size="100%,68px"></dc-import>
    <div style="padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1400px; width: 100%; box-sizing: border-box">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; color: #78716c">Administration · click a cell to change access</span>
          <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -0.8px; line-height: 1.2">Roles &amp; permissions</h1>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><span role="status" style="font-size: 13px; color: #15803d; font-weight: 500">{{toast}}</span></sc-if>
          <button type="button" onClick="{{save}}" style="border: 1px solid #c2410c; background: #c2410c; color: #ffffff; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500">Save changes{{dirtyLabel}}</button>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: #57534e">
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
          <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 9999px; background: {{l.w}}; color: {{l.c}}">{{l.k}}</span>{{l.d}}</span>
        </sc-for>
      </div>

      <section style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 10px; overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; min-width: 900px; font-size: 13px">
          <thead><tr style="text-align: left; color: #78716c; font-size: 12px; background: #fafaf9">
            <th style="font-weight: 500; padding: 12px 14px; border-bottom: 1px solid #e8e6e5">Module</th>
            <sc-for list="{{roleNames}}" as="r" hint-placeholder-count="5"><th style="font-weight: 600; color: #0c0a09; padding: 12px 10px; border-bottom: 1px solid #e8e6e5; text-align: center">{{r}}</th></sc-for>
          </tr></thead>
          <tbody>
            <sc-for list="{{matrix}}" as="m" hint-placeholder-count="14">
              <tr>
                <td style="padding: 9px 14px; border-bottom: 1px solid #f0efee; font-weight: 500">{{m.mod}}</td>
                <sc-for list="{{m.cells}}" as="c" hint-placeholder-count="5">
                  <td style="padding: 7px 10px; border-bottom: 1px solid #f0efee; text-align: center">
                    <button type="button" onClick="{{c.cycle}}" aria-label="{{c.aria}}" style="border: 1px solid {{c.border}}; background: {{c.w}}; color: {{c.c}}; border-radius: 9999px; padding: 3px 12px; font-size: 12px; font-weight: 600; min-width: 64px">{{c.k}}</button>
                  </td>
                </sc-for>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { over: {}, toast: '' }; }
  renderVals() {
    const s = this.state;
    const L = { Full: ['#15803d', '#ecfdf3'], Edit: ['#1d4ed8', '#eef3fe'], View: ['#57534e', '#f1f0ef'], None: ['#a8a29e', '#ffffff'] };
    const order = ['Full', 'Edit', 'View', 'None'];
    const roles = ['Super Admin', 'Project Manager', 'Supervisor', 'Management', 'Driver (app)'];
    const M = [
      ['Dashboard', 'Full View View View None'], ['Vehicle tracking', 'Full View View View None'], ['Live trips', 'Full View Edit View None'],
      ['Vehicle management', 'Full View View None None'], ['Driver management', 'Full View Edit None None'], ['Project management', 'Full Edit View View None'],
      ['Vehicle allocation', 'Full View Edit None View'], ['Trip management', 'Full View Edit View Edit'], ['Issues & tickets', 'Full Edit Edit View Edit'],
      ['Fuel & energy', 'Full View Edit View Edit'], ['Geofence & routes', 'Full View View None None'], ['Reports & analytics', 'Full Edit View View None'],
      ['Alerts & notifications', 'Full Edit Edit View View'], ['Users, roles & settings', 'Full None None None None']
    ];
    const changed = Object.keys(s.over).length;
    const matrix = M.map(([mod, str], mi) => ({
      mod, cells: str.split(' ').map((def, ri) => {
        const key = mi + '-' + ri, v = s.over[key] || def;
        const locked = ri === 0;
        return { k: v, c: L[v][0], w: L[v][1], border: v === 'None' ? '#e8e6e5' : L[v][1], aria: mod + ', ' + roles[ri] + ': ' + v + (locked ? ' (locked)' : ''),
          cycle: () => { if (locked) return; const n = order[(order.indexOf(v) + 1) % 4]; const o = Object.assign({}, s.over); if (n === def) delete o[key]; else o[key] = n; this.setState({ over: o, toast: '' }); } };
      })
    }));
    const legend = [['Full', 'create, edit, delete, configure'], ['Edit', 'create and update'], ['View', 'read and download'], ['None', 'hidden']].map(l => ({ k: l[0], d: l[1], c: L[l[0]][0], w: L[l[0]][1] }));
    return { matrix, roleNames: roles, legend, toast: s.toast, dirtyLabel: changed ? ' (' + changed + ')' : '', save: () => this.setState({ toast: changed ? changed + ' permission change(s) saved and logged.' : 'No changes to save.' }) };
  }
}
</script>
</body>
</html>
