<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app – Profile</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#c2410c}a:hover{color:#9a3412}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafaf9; font-family: Inter, system-ui, sans-serif; color: #0c0a09; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <section style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 6px; text-align: center">
      <span style="width: 80px; height: 80px; border-radius: 9999px; background: #1c1917; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Inter Tight', Inter, sans-serif; font-size: 28px; font-weight: 500">RK</span>
      <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 24px; letter-spacing: -0.5px">Rahul Kumar</h1>
      <span style="font-size: 13px; color: #78716c">Test Driver · JAY-DR-0142</span>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; background: #ecfdf3; color: #15803d">On duty</span>
        <span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; background: #fff1e6; color: #9a3412">4.6 ★ score</span>
      </div>
    </section>
    <section style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 14px; padding: 4px 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f5f5f4; font-size: 13.5px"><span style="color: #78716c">{{r.l}}</span><span style="font-weight: 500; text-align: right">{{r.v}}</span></div>
      </sc-for>
    </section>
    <section style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 14px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f5f5f4; font-size: 13.5px"><span style="color: #78716c">Emergency contact</span><span style="font-weight: 500">Sunita Kumar · Spouse</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 0; font-size: 13.5px"><span style="color: #78716c">Phone</span><a href="tel:+919884012345" style="font-weight: 500; text-decoration: none">+91 98840 12345</a></div>
    </section>
    <a href="Driver-Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 9999px; border: 1px solid #b91c1c; color: #b91c1c; text-decoration: none; font-weight: 600">Log out</a>
    <span style="text-align: center; font-size: 12px; color: #78716c">App v1.0 (prototype) · GPS data is simulated</span>
  </div>
  <dc-import name="DriverNav" active="Profile" hint-size="390px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [['Employee ID', 'JAY-DR-0142'], ['Mobile', '+91 98410 23567'], ['Location', 'Pune · Chakan site'], ['Supervisor', 'Suresh Kumar'], ['Licence', 'MH12 20190000000 · LMV, HMV'], ['Licence valid till', '14 Mar 2031'], ['Total km driven', '62,480 km']].map(r => ({ l: r[0], v: r[1] })) };
  }
}
</script>
</body>
</html>
