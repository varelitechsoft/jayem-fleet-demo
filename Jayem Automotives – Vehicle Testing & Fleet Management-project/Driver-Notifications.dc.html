<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app – Notifications</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#c2410c}a:hover{color:#9a3412}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafaf9; font-family: Inter, system-ui, sans-serif; color: #0c0a09; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 22px 18px 10px; display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 26px; letter-spacing: -0.6px">Notifications</h1>
    <span style="font-size: 13px; color: #78716c">3 new</span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" style="display: flex; gap: 12px; padding: 12px 14px; background: {{n.bg}}; border: 1px solid {{n.border}}; border-radius: 14px; text-decoration: none; color: #0c0a09">
        <span style="width: 38px; height: 38px; flex: 0 0 38px; border-radius: 9999px; background: {{n.w}}; color: {{n.c}}; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600; font-size: 13.5px">{{n.title}}</span><span style="font-size: 12px; color: #78716c; white-space: nowrap">{{n.time}}</span></span>
          <span style="font-size: 13px; color: #57534e">{{n.body}}</span>
        </span>
      </a>
    </sc-for>
  </div>
  <dc-import name="DriverNav" active="Alerts" hint-size="390px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = { car: 'M3 13l2-5h14l2 5v4H3zM6 17v2M18 17v2', swap: 'M7 7h13l-3-3M17 17H4l3 3', msg: 'M4 5h16v11H8l-4 4z', ticket: 'M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4zM10 5v14', warn: 'M12 3l9 16H3zM12 10v4M12 17h.01' };
    const N = [
      [true, 'car', 'New vehicle allocated', 'TN 09 AB 4521 · EV-2026-014 · target 320 km today', '06:41', '#9a3412', '#fff1e6', 'Driver-Home.dc.html'],
      [true, 'ticket', 'Ticket update', 'JAY-TKT-2026-0012 is now In Progress with Suresh Kumar', '10:52', '#1d4ed8', '#eef3fe', 'Driver-MyTickets.dc.html'],
      [true, 'msg', 'Message from supervisor', '"Charge at Chakan DC only today. Station 2 is down."', '09:30', '#15803d', '#ecfdf3', '#'],
      [false, 'warn', 'Testing notice', 'Track closed 13:00–13:30 for calibration. Use NH 60 loop.', 'Yesterday', '#b91c1c', '#fdeeee', '#'],
      [false, 'swap', 'Assignment changed', 'Route changed from Corridor B to Chakan oval + NH 60', 'Yesterday', '#57534e', '#f1f0ef', 'Driver-Assignment.dc.html'],
      [false, 'ticket', 'Ticket resolved', 'JAY-TKT-2026-0001 · rear-left tyre replaced', '04 Nov', '#15803d', '#ecfdf3', 'Driver-MyTickets.dc.html'],
      [false, 'car', 'New vehicle allocated', 'MH 14 TC 3310 · MH-2026-011 · target 260 km', '03 Nov', '#9a3412', '#fff1e6', '#']
    ];
    return { items: N.map(n => ({ title: n[2], body: n[3], time: n[4], d: I[n[1]], c: n[5], w: n[6], href: n[7], bg: n[0] ? '#ffffff' : 'transparent', border: n[0] ? '#fdba8c' : '#e8e6e5' })) };
  }
}
</script>
</body>
</html>
