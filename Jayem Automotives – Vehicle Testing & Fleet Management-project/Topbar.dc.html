<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal top bar</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 28px; background: #ffffff; border-bottom: 1px solid #e8e6e5; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0c0a09">
  <label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; border: 1px solid #d6d3d1; border-radius: 6px; padding: 7px 10px; max-width: 420px; color: #78716c">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
    <input type="search" aria-label="Search" placeholder="Search vehicle, driver, project or ticket ID" style="border: 0; outline: 0; flex: 1; font: inherit; font-size: 13px; color: #0c0a09; background: transparent; min-width: 0">
  </label>
  <div style="flex: 1"></div>
  <a href="Web-Alerts.dc.html" aria-label="Notifications, 7 unread" style="position: relative; width: 40px; height: 40px; border-radius: 9999px; border: 1px solid #e8e6e5; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #0c0a09">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8zM10 20a2 2 0 0 0 4 0"></path></svg>
    <span style="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 9999px; background: #c2410c"></span>
  </a>
  <a href="Web-Login.dc.html" style="display: flex; align-items: center; gap: 10px; padding-left: 4px; text-decoration: none; color: #0c0a09">
    <span style="width: 36px; height: 36px; border-radius: 9999px; background: #1c1917; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{initials}}</span>
    <span style="display: flex; flex-direction: column; line-height: 1.3">
      <span style="font-weight: 500; font-size: 13px">{{name}}</span>
      <span style="font-size: 12px; color: #78716c">{{role}}</span>
    </span>
  </a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"userName":{"editor":"text","default":"Arvind Raman"},"userRole":{"editor":"text","default":"Super Admin · Chennai HO"},"$preview":{"width":1192,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    const name = this.props.userName ?? 'Arvind Raman';
    const role = this.props.userRole ?? 'Super Admin · Chennai HO';
    const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    return { name, role, initials };
  }
}
</script>
</body>
</html>
