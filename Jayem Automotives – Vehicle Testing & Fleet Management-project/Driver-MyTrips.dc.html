<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app – My trips</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#c2410c}a:hover{color:#9a3412}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafaf9; font-family: Inter, system-ui, sans-serif; color: #0c0a09; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 22px 18px 10px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 26px; letter-spacing: -0.6px">My trips</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #78716c">This month</span><span style="font-weight: 600; font-size: 16px">14 trips</span></div>
      <div style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #78716c">Distance</span><span style="font-weight: 600; font-size: 16px">3,912 km</span></div>
      <div style="background: #ffffff; border: 1px solid #e8e6e5; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11.5px; color: #78716c">Score</span><span style="font-weight: 600; font-size: 16px">4.6 ★</span></div>
    </div>
  </header>
  <ul style="list-style: none; margin: 0; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{trips}}" as="t" hint-placeholder-count="7">
      <li>
        <button type="button" onClick="{{t.open}}" style="width: 100%; text-align: left; background: #ffffff; border: 1px solid #e8e6e5; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; color: #0c0a09">
          <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-weight: 600">{{t.date}}</span><span style="font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 9999px; background: {{t.w}}; color: {{t.c}}">{{t.status}}</span></span>
          <span style="font-size: 13px; color: #57534e">{{t.reg}} · {{t.project}}</span>
          <span style="display: flex; justify-content: space-between; width: 100%; font-size: 13px"><span style="color: #78716c">{{t.start}} – {{t.end}}</span><span style="font-weight: 600">{{t.km}} km</span></span>
        </button>
      </li>
    </sc-for>
  </ul>
  <dc-import name="DriverNav" active="My Trips" hint-size="390px,72px"></dc-import>

  <sc-if value="{{sel}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(12,10,9,0.4); display: flex; align-items: flex-end">
      <div role="dialog" aria-label="Trip details" style="width: 100%; background: #ffffff; border-radius: 20px 20px 0 0; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 20px; font-weight: 500">{{sel.date}} trip</span><button type="button" onClick="{{close}}" aria-label="Close" style="width: 40px; height: 40px; border-radius: 9999px; border: 1px solid #e8e6e5; background: #ffffff; font-size: 18px">×</button></div>
        <dl style="margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: 13.5px">
          <dt style="color: #78716c">Trip ID</dt><dd style="margin: 0">{{sel.id}}</dd>
          <dt style="color: #78716c">Vehicle</dt><dd style="margin: 0">{{sel.reg}}</dd>
          <dt style="color: #78716c">Project</dt><dd style="margin: 0">{{sel.project}}</dd>
          <dt style="color: #78716c">Time</dt><dd style="margin: 0">{{sel.start}} – {{sel.end}}</dd>
          <dt style="color: #78716c">Odometer</dt><dd style="margin: 0">{{sel.odo}}</dd>
          <dt style="color: #78716c">Distance</dt><dd style="margin: 0; font-weight: 600">{{sel.km}} km</dd>
          <dt style="color: #78716c">Energy</dt><dd style="margin: 0">{{sel.energy}}</dd>
          <dt style="color: #78716c">Issues</dt><dd style="margin: 0">{{sel.issues}}</dd>
        </dl>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div role="img" aria-label="Start odometer photo" style="height: 64px; border-radius: 8px; background: #1c1917; color: #fdba8c; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace">Start photo</div>
          <div role="img" aria-label="End odometer photo" style="height: 64px; border-radius: 8px; background: #1c1917; color: #fdba8c; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace">End photo</div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: null }; }
  renderVals() {
    const T = [
      ['TRP-26-01186', 'Today', 'TN 09 AB 4521', 'EV-2026-014', '07:14', 'now', 'In progress', '18,432.4 → …', '—', '41.6', 'JAY-TKT-2026-0012'],
      ['TRP-26-01180', '18 Nov', 'TN 09 AB 4521', 'EV-2026-014', '07:14', '14:06', 'Completed', '18,146.0 → 18,432.4', '42.1 kWh', '286.4', '1 ticket'],
      ['TRP-26-01171', '17 Nov', 'TN 09 AB 4521', 'EV-2026-014', '07:05', '14:10', 'Completed', '17,844.8 → 18,146.0', '44.0 kWh', '301.2', 'None'],
      ['TRP-26-01160', '16 Nov', 'MH 14 TC 3310', 'MH-2026-011', '06:58', '13:40', 'Completed', '8,368.0 → 8,612.0', '16.5 L', '244.0', 'None'],
      ['TRP-26-01149', '15 Nov', 'TN 09 AB 4521', 'EV-2026-014', '07:12', '13:55', 'Completed', '17,566.2 → 17,844.8', '41.2 kWh', '278.6', 'None'],
      ['TRP-26-01137', '14 Nov', 'TN 09 AB 4521', 'EV-2026-014', '07:20', '11:02', 'Corrected', '17,410.0 → 17,566.2', '23.4 kWh', '156.2', 'Odometer corrected by supervisor'],
      ['TRP-26-01126', '13 Nov', 'MH 14 TC 3310', 'MH-2026-011', '06:50', '13:30', 'Completed', '8,104.4 → 8,368.0', '17.9 L', '263.6', 'None']
    ];
    const S = { 'In progress': ['#15803d', '#ecfdf3'], Completed: ['#57534e', '#f1f0ef'], Corrected: ['#b45309', '#fef6e7'] };
    const trips = T.map((t, i) => ({ id: t[0], date: t[1], reg: t[2], project: t[3], start: t[4], end: t[5], status: t[6], km: t[9], c: S[t[6]][0], w: S[t[6]][1], open: () => this.setState({ sel: i }) }));
    const x = this.state.sel === null ? null : T[this.state.sel];
    const sel = x ? { id: x[0], date: x[1], reg: x[2], project: x[3], start: x[4], end: x[5], odo: x[7], energy: x[8], km: x[9], issues: x[10] } : null;
    return { trips, sel, close: () => this.setState({ sel: null }) };
  }
}
</script>
</body>
</html>
