<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver app – Active trip</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#c2410c}a:hover{color:#9a3412}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fafaf9; font-family: Inter, system-ui, sans-serif; color: #0c0a09; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <!-- map -->
  <div style="position: relative; height: 380px; flex: 0 0 380px; background: #eeefe9; overflow: hidden">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" role="img" aria-label="Simulated map with test route and current vehicle position">
      <path d="M-5 92 L30 70 L55 64 L105 30" fill="none" stroke="#d6d3d1" stroke-width="12" vector-effect="non-scaling-stroke"></path>
      <path d="M-5 92 L30 70 L55 64 L105 30" fill="none" stroke="#ffffff" stroke-width="8" vector-effect="non-scaling-stroke"></path>
      <path d="M70 -5 L66 40 L80 105 M-5 22 L40 30" fill="none" stroke="#ffffff" stroke-width="5" vector-effect="non-scaling-stroke"></path>
      <ellipse cx="42" cy="44" rx="30" ry="22" fill="none" stroke="#d6d3d1" stroke-width="14" vector-effect="non-scaling-stroke"></ellipse>
      <ellipse cx="42" cy="44" rx="30" ry="22" fill="none" stroke="#e7e5e4" stroke-width="10" vector-effect="non-scaling-stroke"></ellipse>
      <polyline points="{{trail}}" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
    </svg>
    <span style="position: absolute; left: {{px}}%; top: {{py}}%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 9999px; background: #c2410c; box-shadow: 0 0 0 5px rgba(194,65,12,0.22), 0 0 0 2px #ffffff inset"></span>
    <!-- top chip -->
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; background: #ffffff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.10)">
      <span style="width: 10px; height: 10px; border-radius: 9999px; background: #15803d; box-shadow: 0 0 0 4px #dcfce7"></span>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.3">
        <span style="font-weight: 600">TN 09 AB 4521 · Trip live</span>
        <span style="font-size: 12px; color: #78716c">EV-2026-014 · GPS simulated</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 9999px; background: #eef3fe; color: #1d4ed8">EV</span>
    </div>
  </div>

  <!-- sheet -->
  <div style="flex: 1; min-height: 0; margin-top: -20px; position: relative; background: #ffffff; border-radius: 20px 20px 0 0; border-top: 1px solid #e8e6e5; padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #d6d3d1"></span>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; color: #78716c">Current speed</span>
        <span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 52px; font-weight: 500; letter-spacing: -1.5px; line-height: 1; color: {{speedColor}}">{{speed}}<span style="font-size: 16px; letter-spacing: 0; color: #78716c; font-weight: 400"> km/h</span></span>
      </div>
      <sc-if value="{{over}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; background: #fdeeee; color: #b91c1c">Slow down · limit 80</span>
      </sc-if>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; padding: 10px; background: #fafaf9; border: 1px solid #f0efee; border-radius: 10px">
          <span style="font-size: 11.5px; color: #78716c">{{s.label}}</span>
          <span style="font-weight: 600; font-size: 15px">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #57534e">Testing target</span><span style="font-weight: 600">{{done}} / 5,000 km</span></div>
      <div style="height: 8px; border-radius: 9999px; background: #f0efee; overflow: hidden"><div style="height: 100%; width: {{pct}}; background: #c2410c"></div></div>
    </div>
    <div style="flex: 1"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Driver-Issue.dc.html" style="height: 48px; border-radius: 9999px; border: 1px solid #e8e6e5; background: #ffffff; color: #0c0a09; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3zM12 10v4M12 17h.01"></path></svg>
        Report issue
      </a>
      <button type="button" style="height: 48px; border-radius: 9999px; border: 1px solid #b91c1c; background: #fdeeee; color: #b91c1c; font-size: 14px; font-weight: 600">Emergency / SOS</button>
    </div>
    <a href="Driver-Fuel.dc.html" style="align-self: center; font-size: 13px; font-weight: 500; text-decoration: none">Log battery / charging →</a>
    <a href="Driver-EndTrip.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 9999px; background: #1c1917; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; letter-spacing: 0.3px">END TRIP</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tick: 0 }; }
  componentDidMount() { this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const T = this.state.tick;
    const pts = [];
    const start = 0.35, total = start + T * 0.006;
    const steps = Math.max(2, Math.round(total * 60));
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * total * Math.PI * 2 - Math.PI / 2;
      pts.push([42 + 30 * Math.cos(a), 44 + 22 * Math.sin(a)]);
    }
    const last = pts[pts.length - 1];
    const speed = Math.round(64 + 14 * Math.sin(T / 4) + (T % 17 > 13 ? 12 : 0));
    const dist = 41.6 + T * 0.018;
    const mins = 38 + Math.floor(T / 60);
    const odo = 18432 + dist;
    const done = 1850 + dist;
    const fmt1 = n => n.toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    return {
      trail: pts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' '),
      px: last[0].toFixed(2), py: last[1].toFixed(2),
      speed, over: speed > 80, speedColor: speed > 80 ? '#b91c1c' : '#0c0a09',
      stats: [
        { label: 'Distance', value: fmt1(dist) + ' km' },
        { label: 'Duration', value: '0:' + String(mins).padStart(2, '0') + ' h' },
        { label: 'Started', value: '07:14' },
        { label: 'Odometer', value: fmt1(odo) },
        { label: 'Battery', value: Math.max(20, 86 - Math.floor(dist / 4)) + '%' },
        { label: 'Avg. speed', value: '62 km/h' }
      ],
      done: Math.round(done).toLocaleString('en-IN'),
      pct: (done / 5000 * 100).toFixed(1) + '%'
    };
  }
}
</script>
</body>
</html>
