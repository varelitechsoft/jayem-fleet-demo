<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jayem Driver App</title><meta name="theme-color" content="#0f1c36">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>:root{--bg:#fafaf9;--card:#fff;--line:#e8e6e5;--line2:#d6d3d1;--soft:#f0efee;--ink:#0c0a09;--ink2:#44403c;--mute:#57534e;--mute2:#78716c;--navy:#0f1c36;--navy2:#1d2f55;--navtext:#c3cad8;--navmute:#8592ab;--or:#c2410c;--or2:#9a3412;--orw:#fff1e6;--orl:#fdba8c;--green:#15803d;--greenw:#ecfdf3;--red:#b91c1c;--redw:#fdeeee;--blue:#1d4ed8;--bluew:#eef3fe;--amber:#b45309;--amberw:#fef6e7;--r:10px;--font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Inter Tight',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--or);text-decoration:none}a:hover{color:var(--or2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--head);font-weight:500;margin:0;letter-spacing:-.3px}
h1{font-size:28px;letter-spacing:-.7px;line-height:1.2}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--mute2)}.small{font-size:12.5px}.xs{font-size:12px}.b{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;white-space:nowrap;min-height:36px;transition:background .15s,border-color .15s}
.btn:hover{background:#f5f5f4}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:var(--or2);border-color:var(--or2)}
.btn.dark{background:#1c1917;border-color:#1c1917;color:#fff}.btn.dark:hover{background:#000}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:#f5c2c2}.btn.danger:hover{background:var(--redw)}
.btn.sm{padding:4px 12px;min-height:28px;font-size:12px}
.btn[disabled],.btn.dis{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:999px;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--mute)}
.seg button.on{background:#1c1917;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink)}
.chip.on{background:#1c1917;border-color:#1c1917;color:#fff}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:0 0 8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.in,select.in,textarea.in{border:1px solid var(--line2);border-radius:6px;padding:8px 10px;font-size:13.5px;background:#fff;color:var(--ink);width:100%;font-weight:400}
.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--or);outline-offset:-1px;border-color:var(--or)}
textarea.in{resize:vertical}
.err{color:var(--red);font-size:12.5px}
.prog{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}.prog>i{display:block;height:100%;background:var(--or);border-radius:999px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute2);font-size:12px;padding:10px;border-bottom:1px solid var(--line);background:#fafaf9;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fff7ed}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12.5px;color:var(--mute2);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-family:var(--head);font-size:27px;font-weight:500;letter-spacing:-.6px;line-height:1.15}
.kpi .d{font-size:12px;color:var(--mute2)}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:7px 12px;font-size:13px}dl.kv dt{color:var(--mute2)}dl.kv dd{margin:0}
.toast-wrap{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9999;max-width:min(420px,calc(100vw - 32px))}
.toast{background:#1c1917;color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
.toast.ok{background:#14532d}.toast.warn{background:#7c2d12}.toast.bad{background:#7f1d1d}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(12,10,9,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5000}
.modal{background:#fff;border-radius:16px;width:640px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 45px rgba(17,12,46,.2)}
.empty{padding:40px 20px;text-align:center;color:var(--mute2);font-size:13px}
.photo{border-radius:8px;background:#1c1917;object-fit:cover;width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.leaflet-container{font-family:var(--font)}
.vm{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);width:max-content}
.vm .c{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 2px #fff,0 3px 10px rgba(0,0,0,.4)}
.vm.sel .c{box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(194,65,12,.5),0 3px 10px rgba(0,0,0,.4)}
.vm .t{font-size:10.5px;font-weight:600;background:#fff;color:#0c0a09;border-radius:4px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mapfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mute);background:#eeefe9;font-size:13px}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#ffffff 0,#ecebe9 55%,#e2e0de 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:56px}
.stageinfo{max-width:300px;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.stageinfo .lg{width:44px;height:44px;border-radius:12px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:600;font-size:22px}
.stageinfo h1{font-size:30px;letter-spacing:-.8px;line-height:1.15}
.stageinfo p{margin:0;color:var(--mute);font-size:14px}
.stageinfo ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px;display:flex;flex-direction:column;gap:4px}
.stage{flex:0 0 auto;position:relative}
.phone{position:absolute;left:0;top:0;transform-origin:0 0;width:402px;height:860px;flex:0 0 auto;border-radius:56px;background:#111;padding:12px;box-shadow:0 0 0 2px #2b2b2b,0 0 0 4px #9a9a9a33,0 40px 90px rgba(0,0,0,.28),0 12px 30px rgba(0,0,0,.18)}
.phone:before{content:'';position:absolute;left:-3px;top:150px;width:3px;height:64px;border-radius:3px 0 0 3px;background:#2b2b2b;box-shadow:0 86px 0 #2b2b2b}
.phone:after{content:'';position:absolute;right:-3px;top:200px;width:3px;height:96px;border-radius:0 3px 3px 0;background:#2b2b2b}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:14px;font-weight:600;color:var(--ink);background:#fff;position:relative;z-index:900}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:6px;align-items:center}
#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
#app::-webkit-scrollbar{display:none}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#0c0a09;opacity:.85;z-index:950;pointer-events:none}
.app{min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
.phone .modal-bg,.phone .toast-wrap{position:absolute}
.phone .modal-bg{border-radius:44px;z-index:980}
.phone .toast-wrap{left:26px;right:26px;transform:none;width:auto;top:auto;bottom:150px;z-index:990}
@media (max-width:900px){.stageinfo{display:none}}
body{padding:16px;gap:48px}
body.native{padding:0;display:block;background:var(--bg)}
body.native .stage{width:100%!important;height:100vh!important;height:100dvh!important}
body.native .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none!important}
body.native .phone:before,body.native .phone:after,body.native .homebar,body.native .island{display:none}
body.native .screen,body.native .phone .modal-bg{border-radius:0}
.hdr{position:sticky;top:0;z-index:700;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 6px;background:#fff;border-bottom:1px solid var(--line);min-height:60px}
.hdr .bk{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 44px}
.hdr .bk:hover{background:#f5f5f4}
.hdr h1{font-size:19px;letter-spacing:-.3px}
.hdr .sub{font-size:12px;color:var(--mute2)}
.scr{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.foot{position:sticky;bottom:0;z-index:600;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:999px;border:0;background:var(--or);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.3px}
.big:hover{background:var(--or2);color:#fff}
.big.dark{background:#1c1917}.big.dark:hover{background:#000}
.big.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.big.green{background:var(--green)}
.big.off{background:#e7e5e4;color:var(--mute2);cursor:not-allowed}
.big.red{background:var(--redw);color:var(--red);border:1px solid var(--red)}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--mute2)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink2)}
.fld .in{height:50px;border-radius:10px;font-size:16px;padding:0 14px}
.fld textarea.in{height:auto;padding:10px 12px;font-size:15px}
.fld select.in{padding:0 10px}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14.5px}
.ck input{width:22px;height:22px;accent-color:var(--or);flex:0 0 22px}
.photobtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photobtn{height:72px;border:1px dashed #a8a29e;border-radius:12px;background:#fafaf9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;position:relative}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catgrid button{min-height:62px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;font-size:12px;font-weight:500;line-height:1.25}
.catgrid button.on{border-color:var(--or);background:#fff7ed}
.stat{display:flex;flex-direction:column;padding:10px;background:#fafaf9;border:1px solid var(--soft);border-radius:10px}
.stat .k{font-size:11.5px;color:var(--mute2)}.stat .v{font-weight:600;font-size:15px}
.tmap{position:relative;height:300px;background:#eeefe9}
.tmap .map{position:absolute;inset:0}
.sheet{margin-top:-18px;position:relative;z-index:500;background:#fff;border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.handle{align-self:center;width:40px;height:4px;border-radius:999px;background:var(--line2)}
.hero{background:var(--navy);color:#fff;padding:48px 22px 38px;display:flex;flex-direction:column;gap:20px}
.listbtn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.listbtn:hover{border-color:var(--orl)}

.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 38px}
.mapfail{position:absolute;inset:0}


.phone .foot{padding-bottom:24px}
.foot.wn{bottom:var(--navh);padding-bottom:12px}
body.native .phone .foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}

.appbar{padding:8px 12px 8px 14px;gap:10px}
.abrand{flex:0 0 36px}.alg{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:600;font-size:17px}
.aav{width:36px;height:36px;border-radius:999px;background:#1c1917;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:0 0 36px}
.nbd{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--or);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

:root{--navh:84px}
.bnav{position:sticky;bottom:0;z-index:600;height:var(--navh);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:7px 14px 0}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute2);min-height:52px}
.bnav .bi{position:relative;width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.bnav a.on{color:var(--or2);font-weight:600}
.bnav a.on .bi{background:var(--orw);color:var(--or)}
.bnav .bd{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--or);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
body.native{--navh:calc(64px + env(safe-area-inset-bottom))}
body.native .bnav{padding:7px 6px env(safe-area-inset-bottom)}
.hmap{position:relative;height:150px;border-radius:12px;overflow:hidden;background:#e7ebe3;margin:-2px 0 2px}
.hmap .map{position:absolute;inset:0}
.hmapl{position:absolute;left:8px;bottom:8px;z-index:500;display:inline-flex;align-items:center;gap:5px;max-width:calc(100% - 16px);background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hmap .leaflet-control-attribution{font-size:9px}
/* v1.1: quick actions, stops, stations, fleet map */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;padding:8px 4px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.qa a:hover{border-color:var(--orl)}
.qa .qi{width:36px;height:36px;border-radius:999px;background:var(--orw);color:var(--or2);display:flex;align-items:center;justify-content:center}
.qa .sosq{border-color:#f5b5b5;background:#fdeeee;color:var(--red);font-weight:700}
.qa .sosq .qi{background:var(--red);color:#fff}
.pausebox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#fffbf2;border:1px solid #fcd9a8}
.brk{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:#f5f5f4;font-size:12.5px;color:var(--mute)}
.brk b{color:var(--ink)}
.brk.soon{background:#fef6e7;color:#92400e}
.brk.due{background:#fdeeee;color:var(--red)}.brk.due b{color:var(--red)}
.lnk{border:0;background:none;color:var(--or2);font-weight:600;font-size:12px;padding:0;white-space:nowrap;cursor:pointer}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:500}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:0 0 auto}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{white-space:nowrap;flex:0 0 auto}
.snum{width:24px;height:24px;flex:0 0 24px;border-radius:999px;background:#1c1917;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.stm{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:999px;background:#c2410c;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font:600 12px var(--font);display:flex;align-items:center;justify-content:center}
.snap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:0 0 auto}
.snap button{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--mute);text-align:left}
.snap button b{font-family:var(--head);font-size:19px;line-height:1.1}
.snap button.on{border-color:#1c1917;box-shadow:inset 0 0 0 1px #1c1917}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute2)}
.wk i{font-style:normal}
.wk b{padding:6px 0;border-radius:8px;background:#f5f5f4;color:var(--mute);font-size:13px}
.wk .sA{background:#fff1e6;color:#c2410c}.wk .sB{background:#eef3fe;color:#1d4ed8}.wk .sC{background:#f3effe;color:#6d28d9}.wk .sG{background:#ecfdf3;color:#15803d}
.iconbtn.lng{font-size:12px;font-weight:700;color:var(--ink)}
.seg button:disabled{opacity:.4}
.democase{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer}
.democase.on{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.democase .dci{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
body:not(.native){flex-direction:column;gap:14px}
.casebar{display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);flex:0 0 auto}

function tripTick() {

}

  const stops = (act.stops || []).concat(act.pause ? [Object.assign({ to: Date.now() }, act.pause)] : []);

U.endTrip = () => {
  const F = DS.ui.end, act = myActive(); F.odo = val('e_odo'); F.energy = val('e_en'); F.remarks = val('e_rem'); if (document.getElementById('e_soc')) F.soc = val('e_soc');

  if (ev && !DS.ui.endSocPhoto) { err.textContent = 'Add the end battery % photo.'; return; }
  if (isNaN(n) || (n < act.startOdo && !F.corr)) { err.textContent = 'Fix the odometer reading.'; render(); return; }
  const d = me(), now = Date.now();
  const km = Math.max(0, Math.round((n - act.startOdo) * 10) / 10), mins = Math.max(1, Math.round((now - act.startTs) / 60e3));
  const energy = Math.max(0.1, parseFloat(F.energy) || (ev ? km / 6.8 : km / 10));
  const stops = (act.stops || []).concat(act.pause ? [Object.assign({}, act.pause, { to: now })] : []);
  const id = J.tx(s => {
    const id = act.tripId || ('TRP-26-' + String(s.seq.trip).padStart(5, '0')); s.seq.trip++;
    const p = s.projects.find(x => x.id === v.project);
    s.trips.push({ id, vehicleId: v.id, driverId: d.id, project: v.project, type: (s.assignments[d.id] || {}).type || (p || {}).type, site: v.site, startTs: act.startTs, endTs: now, odoS: act.startOdo, odoE: n, km, mins, avg: Math.round(km / mins * 60) || 55, max: Math.max(act.maxSp || 0, 72), idle: Math.round(mins * J.SPEEDUP * 0.06), energy: Math.round(energy * 10) / 10, unit: ev ? 'kWh' : v.fuel === 'CNG' ? 'kg' : 'L', battS: ev ? (act.startSoc || 96) : null, battE: ev ? parseInt(F.soc) || null : null, cost: ev ? null : Math.round(energy * (v.fuel === 'Petrol' ? 104.6 : 92.4)), route: act.route, routeName: act.routeName, status: 'Completed', tickets: s.tickets.filter(t => t.tripId === id).map(t => t.id), remarks: F.remarks + (F.corr ? ' (odometer correction authorised by ' + d.sup + ')' : ''), photoS: act.photo, photoE: DS.ui.endPhoto, socPhotoE: DS.ui.endSocPhoto || null, shift: act.shift || 'A', breaks: stops.length, stops: stops.map(x => ({ from: x.from, to: x.to, reason: x.reason, odo: x.odo, soc: x.soc, notes: x.notes })), log: { regen: ev ? F.regen : 'NA', ac: F.ac, load: F.load, mode: F.mode, anc: F.anc } });
    const vv = s.vehicles.find(x => x.id === v.id); vv.odo = n; vv.done += km; vv.status = 'Idle'; vv.history.push({ t: now, x: 'Trip ' + id + ' completed · ' + km + ' km · odometer ' + n, by: d.name });

    const dd = s.drivers.find(x => x.id === d.id); dd.avail = 'Available'; dd.km = Math.round(dd.km + km); dd.trips++;
    if (s.assignments[d.id]) s.assignments[d.id].status = 'Completed';

    return id;

};

function fitPhone() { const st = document.getElementById('stage'), ph = document.getElementById('phone'); if (!st || !ph) return; if (document.body.classList.contains('native')) { st.style.width = ''; st.style.height = ''; ph.style.transform = ''; return; } const pad = 32, info = 0, bar = 58; const s = Math.min(1, (window.innerWidth - pad - info) / 402, (window.innerHeight - pad - bar) / 860); ph.style.transform = 'scale(' + s + ')'; st.style.width = (402 * s) + 'px'; st.style.height = (860 * s) + 'px'; if (DS.map) setTimeout(() => DS.map.invalidateSize(), 50); }
(function () { const native = matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 520 && window.self === window.top; if (native) document.body.classList.add('native'); fitPhone(); window.addEventListener('resize', fitPhone); })();
