/* ---- leaflet helpers ---- */
function mkMap(el, center, zoom, sat) {
  if (typeof L === 'undefined') { el.innerHTML = '<div class="mapfail">The map needs an internet connection to load map tiles.<br>Everything else keeps working offline.</div>'; return null; }
  const m = L.map(el, { zoomControl: true, attributionControl: true }).setView(center, zoom);
  const std = L.tileLayer(J.TILES.std[0], { maxZoom: 19, maxNativeZoom: 16, attribution: J.TILES.std[1] });
  const satL = L.tileLayer(J.TILES.sat[0], { maxZoom: 19, attribution: J.TILES.sat[1] });
  (sat ? satL : std).addTo(m); m._std = std; m._sat = satL; A.maps.push(m); return m;
}
function setBase(m, sat) { if (!m) return; if (sat) { m.removeLayer(m._std); m._sat.addTo(m); } else { m.removeLayer(m._sat); m._std.addTo(m); } }
function vIcon(v, sel, speed) {
  const st = J.status(v); const c = speed > J.S.settings.limitTrack ? '#b91c1c' : (J.STATUS_C[st] || ['#57534e'])[0];
  return L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="vm' + (sel ? ' sel' : '') + '"><span class="c" style="background:' + c + '">' + ic(v.kind === 'ev' ? 'ev' : v.kind === 'truck' ? 'truck' : 'car', 16, 2) + '</span><span class="t">' + esc(v.reg) + '</span></div>' });
}
function drawFences(m, site) { if (!m) return; J.S.geofences.filter(g => !site || site === 'All' || g.site === site).forEach(g => { L.polygon(g.pts, { color: g.color, weight: 2, dashArray: '6 5', fillOpacity: 0.08 }).addTo(m).bindTooltip(g.name, { sticky: true }); }); }

/* ---- simulated alert engine (portal acts as the server) ---- */
let lastGeo = Date.now();
setInterval(() => {
  if (!A.ses) return;
  const S = J.S, now = Date.now(), lim = S.settings.limitTrack;
  const fresh = [];
  S.vehicles.forEach(v => {
    if (J.status(v) !== 'Running') return;
    const L2 = J.live(v, now);
    if (L2.speed > lim && !S.alerts.some(a => a.vehicleId === v.id && a.type === 'Overspeed' && now - a.ts < 120e3)) fresh.push(['Overspeed', v.id, v.reg + ' at ' + L2.speed + ' km/h (limit ' + lim + ')']);
  });
  if (now - lastGeo > 75e3) {
    lastGeo = now; const run = S.vehicles.filter(v => v.sim && v.sim.route === 'hwy');
    const v = run[Math.floor(Math.random() * run.length)];
    if (v) fresh.push([Math.random() < 0.5 ? 'Geofence Exit' : 'Geofence Entry', v.id, v.reg + (Math.random() < 0.5 ? ' left ' : ' entered ') + (S.geofences.find(g => g.site === v.site) || { name: 'site zone' }).name]);
    const idle = S.vehicles.filter(x => x.status === 'Idle');
    const vi = idle[Math.floor(Math.random() * idle.length)];
    if (vi) fresh.push(['Vehicle Idle', vi.id, vi.reg + ' idling ' + (S.settings.idleMin + Math.floor(Math.random() * 15)) + ' min with ignition on']);
  }
  const due = S.alerts.some(a => !a.ack && !a.resolved && a.due && a.level < 2 && now >= a.due) || S.tickets.some(t => t.status === 'Open' && (t.level || 0) < 2);
  if (due) { let n = 0; J.tx(s => { n = J.escalate(s); }); if (n) { toast('<b>' + n + ' alert' + (n > 1 ? 's' : '') + ' escalated</b> · no response within the set time', 'warn'); if (A.route === 'alerts' || A.route === 'dashboard') render(); } }
  if (!fresh.length) return;
  J.tx(s => fresh.forEach(f => J.addAlert(s, f[0], f[1], f[2])));
  fresh.filter(f => inScopeV(f[1]) && f[0] === 'Overspeed').slice(0, 1).forEach(f => toast('<b>Overspeed</b> · ' + esc(f[2]), 'bad'));
}, 4000);

J.on(src => {
  if (src !== 'remote' || !A.ses) return;
  if (['tracking', 'live', 'geofence'].indexOf(A.route) >= 0) return; // live pages pick it up on tick

function gantt(p, minT, maxT) { const st = new Date(p.start + 'T00:00:00').getTime(), en = new Date(p.end + 'T00:00:00').getTime(), g = projAge(p), span = maxT - minT; const L = (st - minT) / span * 100, W = (en - st) / span * 100, T = (Date.now() - minT) / span * 100; const pe = g.projEnd && g.projEnd > en ? (g.projEnd - en) / span * 100 : 0; return '<div class="gantt"><div class="bar" style="left:' + L + '%;width:' + W + '%;background:' + PSTAT_C[p.status][1] + ';border:1px solid ' + PSTAT_C[p.status][0] + '40"></div><div class="bar" style="left:' + L + '%;width:' + (W * g.kmPct / 100) + '%;background:' + HEALTH_C[g.health][0] + ';opacity:.85"></div>' + (pe ? '<div class="bar" style="left:' + (L + W) + '%;width:' + Math.min(pe, 100 - L - W) + '%;background:repeating-linear-gradient(45deg,#fdeeee,#fdeeee 4px,#f5b5b5 4px,#f5b5b5 8px)" title="Projected delay"></div>' : '') + '<div class="today" style="left:' + T + '%" title="Today"></div></div>'; }

PAGES.analytics = () => {
  const S = J.S, ps = scopeProjects(); const p = J.P(A.query.p) || ps.find(x => x.status === 'Ongoing') || ps[0]; if (!p) return '<div class="card empty">No projects.</div>';
  const g = projAge(p), vs = S.vehicles.filter(v => v.project === p.id), tr = S.trips.filter(t => t.project === p.id).sort((a, b) => a.startTs - b.startTs), tk = S.tickets.filter(t => t.project === p.id);
  const vDone = vs.filter(v => v.done >= v.target || J.status(v) === 'Completed').length;
  const tt = S.testTypes.find(t => t.name === p.testType) || { params: [] }; const params = p.params || tt.params;
  const cov = params.map((x, i) => [x[0], Math.min(100, Math.round(g.kmPct * (0.75 + ((i * 37) % 40) / 100)))]);
  const covAvg = cov.length ? Math.round(cov.reduce((a, c) => a + c[1], 0) / cov.length) : 0;
  // cumulative km: actual vs plan over time
  const st = new Date(p.start + 'T00:00:00').getTime(), en = new Date(p.end + 'T00:00:00').getTime(), now = Date.now();
  const pts = [], plan = []; const steps = 10; for (let i = 0; i <= steps; i++) { const t = st + (Math.min(now, en) - st) * i / steps; const lab = new Date(t).getDate() + ' ' + new Date(t).toLocaleDateString('en-IN', { month: 'short' }); const prog = (t - st) / Math.max(1, Math.min(now, en) - st); pts.push([lab, Math.round(p.achieved * Math.pow(prog, 1.08))]); plan.push([lab, Math.round(p.target * (t - st) / Math.max(1, en - st))]); }

  const cats = J.TICKET_CATS.map(c => [c, tk.filter(t => t.cat === c).length]).filter(x => x[1]);
  const drv = {}; tr.forEach(t => drv[t.driverId] = (drv[t.driverId] || 0) + t.km); const topD = Object.keys(drv).sort((a, b) => drv[b] - drv[a]).slice(0, 6).map(id => [dName(id), Math.round(drv[id]), fmt(drv[id]) + ' km']);
  const card = (t, sub, inner) => '<section class="card pad" style="display:flex;flex-direction:column;gap:12px;min-width:0"><div><h2>' + t + '</h2>' + (sub ? '<span class="xs muted">' + sub + '</span>' : '') + '</div>' + inner + '</section>';
  return ph('Project analytics · ' + esc(p.client) + ' · ' + esc(p.testType), esc(p.name), '<label class="row small" style="gap:8px"><span class="muted">Project</span><select class="in" style="width:auto;min-width:240px" onchange="UI.go(\'analytics?p=\'+this.value)">' + opt(ps.map(x => [x.id, x.id + ' · ' + x.name]), p.id) + '</select></label><a class="btn" href="#/project/' + p.id + '">Project details</a>') +
    '<section class="kpis">' + kpi('Progress', g.kmPct.toFixed(0) + '%', fmt(p.achieved) + ' of ' + fmt(p.target) + ' km', '#c2410c') + kpi('Testing coverage', covAvg + '%', params.length + ' parameters tracked', '#1d4ed8') + kpi('Testing completed', vDone + ' / ' + vs.length, (vs.length - vDone) + ' vehicles pending', '#15803d') + kpi('Project ageing', p.status === 'Pending' ? '—' : g.elapsed + ' d', 'of ' + g.total + ' planned · ' + g.timePct.toFixed(0) + '% time used') + kpi('Schedule', g.health, g.projEnd ? 'Projected end ' + fDate(g.projEnd) : 'Not started', HEALTH_C[g.health][0], g.health === 'Behind' ? '#b91c1c' : null) + kpi('Issues', tk.length, tk.filter(t => t.status !== 'Closed').length + ' open') + '</section>' +
    '<div class="acols"><div class="acol">' + card('Kilometres: actual vs plan', 'Cumulative km since start', lineChart([{ name: 'Actual', color: '#c2410c', pts }, { name: 'Plan', color: '#a8a29e', pts: plan }], { label: 'Actual vs planned km' })) +
    card('Testing completed vs pending', 'Vehicles that reached their km target', '<div style="display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px"><div style="flex:' + Math.max(vDone, 0.001) + ';background:#15803d"></div><div style="flex:' + Math.max(vs.length - vDone, 0.001) + ';background:#e7e5e4"></div></div><div class="row small"><span class="row" style="gap:6px"><span class="dot" style="background:#15803d"></span>Completed <b>' + vDone + '</b></span><span class="row" style="gap:6px"><span class="dot" style="background:#a8a29e"></span>Pending <b>' + (vs.length - vDone) + '</b></span></div>' + (byV.length ? hbars(byV, '', '#15803d') : '<div class="empty">No vehicles mapped</div>')) +
    card('Driver-wise distance', 'Km driven on this project', topD.length ? hbars(topD) : '<div class="empty">No trips yet</div>') + '</div><div class="acol">' +
    card('Testing coverage by parameter', 'Share of each test requirement completed', hbars(cov.map(c => [c[0], c[1], c[1] + '%']), '', '#1d4ed8')) +
    card('Project KPIs', '', '<dl class="kv"><dt>Trips run</dt><dd class="b">' + tr.length + '</dd><dt>Avg km per trip</dt><dd>' + (tr.length ? fmt(tr.reduce((a, t) => a + t.km, 0) / tr.length, 1) : '—') + '</dd><dt>Running hours</dt><dd>' + fmt(tr.reduce((a, t) => a + t.mins, 0) / 60) + ' h</dd><dt>Overspeed trips</dt><dd>' + tr.filter(t => t.max > S.settings.limitTrack).length + '</dd><dt>Breaks taken</dt><dd>' + tr.reduce((a, t) => a + (t.breaks || 0), 0) + '</dd><dt>Daily km needed</dt><dd>' + (p.status === 'Ongoing' ? fmt(Math.max(0, p.target - p.achieved) / Math.max(1, (en - now) / 864e5)) + ' km/day to finish on time' : '—') + '</dd></dl>') +

const REPORTS = ['Daily Trip Report', 'Vehicle-wise Trip Report', 'Driver Performance Report', 'Project Progress Report', 'Vehicle Performance Report', 'Odometer Report', 'Fuel Consumption Report', 'EV Energy Consumption Report', 'Issue and Ticket Report', 'Overspeed Report', 'Idle Vehicle Report', 'Vehicle Utilisation Report', 'GPS Tracking History', 'Daily Trip Log (sheet format)', 'EV Charging Log'];

  const group = key => { const g = {}; tr.forEach(t => { (g[t[key]] = g[t[key]] || []).push(t); }); return g; };
  const sum = (a, k) => a.reduce((x, t) => x + (t[k] || 0), 0);
  const lim = S.settings.limitTrack;

    case 2: { const g = group('driverId'); return { cols: ['Driver', 'Employee ID', 'Trips', 'Km', 'Avg speed', 'Max speed', 'Overspeed trips', 'Score'], rows: Object.keys(g).map(id => { const d = J.D(id); return [d.name, d.emp, g[id].length, +sum(g[id], 'km').toFixed(1), Math.round(sum(g[id], 'avg') / g[id].length), Math.max.apply(null, g[id].map(t => t.max)), g[id].filter(t => t.max > lim).length, d.score]; }) }; }
    case 3: return { cols: ['Project', 'Name', 'Client', 'Target km', 'Achieved km', 'Remaining km', '% done', 'Status'], rows: scopeProjects().filter(p => F.proj === 'All' || p.id === F.proj).map(p => [p.id, p.name, p.client, p.target, p.achieved, p.target - p.achieved, Math.round(p.achieved / p.target * 100) + '%', p.status]) };
    case 4: { const g = group('vehicleId'); return { cols: ['Vehicle', 'Km', 'Running h', 'Idle h', 'Efficiency', 'Max speed', 'Tickets'], rows: Object.keys(g).map(id => [vReg(id), +sum(g[id], 'km').toFixed(1), +(sum(g[id], 'mins') / 60).toFixed(1), +(sum(g[id], 'idle') / 60).toFixed(1), (sum(g[id], 'km') / sum(g[id], 'energy')).toFixed(1) + (g[id][0].unit === 'kWh' ? ' km/kWh' : ' km/L'), Math.max.apply(null, g[id].map(t => t.max)), S.tickets.filter(k => k.vehicleId === id).length]) }; }
    case 5: return { cols: ['Trip', 'Date', 'Vehicle', 'Start odometer', 'End odometer', 'Km', 'Photos'], rows: tr.map(t => [t.id, fDate(t.startTs), vReg(t.vehicleId), t.odoS, t.odoE, t.km, 'Start + end verified']) };
    case 6: { const x = tr.filter(t => t.unit === 'L'); return { cols: ['Trip', 'Date', 'Vehicle', 'Km', 'Litres', 'Cost (₹)', 'km/L'], rows: x.map(t => [t.id, fDate(t.startTs), vReg(t.vehicleId), t.km, t.energy, t.cost, (t.km / t.energy).toFixed(1)]) }; }
    case 7: { const x = tr.filter(t => t.unit === 'kWh'); return { cols: ['Trip', 'Date', 'Vehicle', 'Km', 'kWh', 'km/kWh', 'Battery start', 'Battery end'], rows: x.map(t => [t.id, fDate(t.startTs), vReg(t.vehicleId), t.km, t.energy, (t.km / t.energy).toFixed(1), t.battS + '%', t.battE + '%']) }; }

    case 9: return { cols: ['Date', 'Vehicle', 'Driver', 'Max speed', 'Limit', 'Source'], rows: tr.filter(t => t.max > lim).map(t => [fDate(t.startTs), vReg(t.vehicleId), dName(t.driverId), t.max, lim, 'Trip ' + t.id]).concat(S.alerts.filter(a => a.type === 'Overspeed' && ids.has(a.vehicleId) && a.ts >= fromTs && a.ts < toTs).map(a => [fDate(a.ts) + ' ' + fTime(a.ts), vReg(a.vehicleId), dName(J.V(a.vehicleId).driverId), a.text.replace(/.* at (\d+).*/, '$1'), lim, 'Live alert'])) };

    '<label class="f xs">Test area<select class="in" onchange="UI.shF(\'area\',this.value)">' + opt([['All', 'All areas'], ['CHK', 'Chakan'], ['TLG', 'Talegaon'], ['RNJ', 'Ranjangaon']], F.area) + '</select></label>' +
    '<label class="f xs">' + (F.w === 0 ? 'Shift today' : 'Shift on Monday') + '<select class="in" onchange="UI.shF(\'f\',this.value)">' + opt([['All', 'All shifts'], ['A', 'Shift A'], ['B', 'Shift B'], ['C', 'Shift C'], ['G', 'General'], ['OFF', 'Off'], ['LEAVE', 'Leave']], F.f) + '</select></label>' +
    '<label class="f xs" style="flex:1;min-width:180px">Search<input class="in" placeholder="Driver name or employee ID" value="' + esc(F.q) + '" onchange="UI.shF(\'q\',this.value)"></label>' +
    '<span class="small muted">' + days[0].d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' – ' + days[6].d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + '</span></section>' +
    (edit ? '<section class="card shbulk" aria-label="Bulk assign"><b class="small">' + (selN ? selN + ' selected' : 'Select drivers below') + '</b><span class="small muted">Assign</span><select class="in" onchange="A.ui.sh.bulkShift=this.value">' + opt([['A', 'Shift A'], ['B', 'Shift B'], ['C', 'Shift C'], ['G', 'General'], ['OFF', 'Off'], ['LEAVE', 'Leave']], F.bulkShift) + '</select><span class="small muted">for</span><select class="in" onchange="A.ui.sh.bulkDays=this.value">' + opt([['week', 'Whole week'], ['wd', 'Mon – Sat'], ['rest', 'Remaining days']].concat(days.map((x, k) => [String(k), x.d.toLocaleDateString('en-IN', { weekday: 'long' })])), F.bulkDays) + '</select><button class="btn pri sm" ' + (selN ? '' : 'disabled') + ' onclick="UI.shBulk()">Apply</button>' + (selN ? '<button class="btn sm" onclick="A.ui.sh.sel={};render()">Clear</button>' : '') + '<span class="sp"></span><span class="xs muted">Drivers see changes in the app at once.</span></section>' : '') +
    '<section class="card" style="min-width:0"><div class="tw"><table class="tbl shtbl" style="min-width:980px"><thead><tr>' + (edit ? '<th style="width:34px"><input type="checkbox" aria-label="Select all on page" onchange="UI.shAll(this.checked)"></th>' : '') + '<th>Driver</th><th>Area</th>' + days.map(x => '<th style="text-align:center;' + (x.today ? 'color:var(--or2)' : '') + '">' + x.d.toLocaleDateString('en-IN', { weekday: 'short' }) + '<br><span class="xs muted" style="font-weight:400">' + x.d.getDate() + ' ' + x.d.toLocaleDateString('en-IN', { month: 'short' }) + '</span></th>').join('') + '<th style="text-align:right">Hours</th></tr></thead><tbody>' +
    (rows.map(d => { const h = days.reduce((a, x) => a + shHours(shGet(x.key, d.id)), 0); return '<tr>' + (edit ? '<td><input type="checkbox" aria-label="Select ' + esc(d.name) + '" ' + (F.sel[d.id] ? 'checked' : '') + ' onchange="A.ui.sh.sel[\'' + d.id + '\']=this.checked;render()"></td>' : '') + '<td><a href="#/driver/' + d.id + '" class="b" style="color:var(--ink)">' + esc(d.name) + '</a><br><span class="xs muted">' + d.emp + ' · ' + d.avail + '</span></td><td class="small">' + J.SITES[d.site].short + '</td>' + days.map((x, k) => cell(d, x, k)).join('') + '<td class="b" style="text-align:right;color:' + (h > 54 ? '#b91c1c' : 'inherit') + '">' + h + ' h</td></tr>'; }).join('') || '<tr><td colspan="11" class="empty">No drivers match.</td></tr>') +
    '</tbody><tfoot><tr><td colspan="' + (edit ? 3 : 2) + '" class="xs b muted">COVERAGE (A / B / C / G)</td>' + cov.map(c => '<td style="text-align:center" class="xs"><span style="color:#c2410c">' + c.A + '</span> / <span style="color:#1d4ed8">' + c.B + '</span> / <span style="color:#6d28d9">' + c.C + '</span> / <span style="color:#15803d">' + c.G + '</span></td>').join('') + '<td></td></tr></tfoot></table></div>' +
    '<div class="row pad" style="padding-top:10px"><span class="small muted sp">Showing ' + (list.length ? F.page * per + 1 : 0) + '–' + Math.min(list.length, F.page * per + per) + ' of ' + list.length + '</span><button class="btn sm" ' + (F.page ? '' : 'disabled') + ' onclick="A.ui.sh.page--;render()">Previous</button><button class="btn sm" ' + (F.page < pages - 1 ? '' : 'disabled') + ' onclick="A.ui.sh.page++;render()">Next</button></div></section>';
};
UI.shW = w => { A.ui.sh.w = +w; A.ui.sh.page = 0; render(); };
UI.shF = (k, v) => { A.ui.sh[k] = v; A.ui.sh.page = 0; render(); };
UI.shAll = on => { const F = A.ui.sh; const days = weekDays(F.w); scopeD().filter(d => (F.area === 'All' || d.site === F.area) && (!F.q || (d.name + ' ' + d.emp).toLowerCase().indexOf(F.q.toLowerCase()) >= 0)).slice(F.page * 20, F.page * 20 + 20).forEach(d => { F.sel[d.id] = on; }); render(); };
function shWrite(s, id, day, code) { s.roster[day] = s.roster[day] || {}; const old = s.roster[day][id]; if (old === code) return false; s.roster[day][id] = code; return true; }
UI.shSet = (id, day, code) => { const d = J.D(id); J.tx(s => { if (shWrite(s, id, day, code)) { const sh = s.shifts.find(x => x.id === code); J.notify(s, id, 'Shift updated', fDay(new Date(day + 'T00:00:00').getTime()) + ': ' + (sh ? sh.name + ' ' + sh.from + '–' + sh.to : SH_LBL[code]), 'profile', 'cal'); } }); toast(esc(d.name) + ' · ' + day + ' → ' + (SH_LBL[code] || 'Shift ' + code), 'ok'); render(); };
UI.shBulk = () => { const F = A.ui.sh, days = weekDays(F.w); const ids = Object.keys(F.sel).filter(k => F.sel[k]); const pick = days.filter((x, k) => !x.past && (F.bulkDays === 'week' || F.bulkDays === 'rest' || (F.bulkDays === 'wd' ? k < 6 : String(k) === F.bulkDays))); let n = 0; J.tx(s => { ids.forEach(id => { let ch = 0; pick.forEach(x => { if (shWrite(s, id, x.key, F.bulkShift)) { n++; ch++; } }); if (ch) J.notify(s, id, 'Shifts updated', ch + ' day' + (ch > 1 ? 's' : '') + ' changed to ' + (SH_LBL[F.bulkShift] || 'Shift ' + F.bulkShift), 'profile', 'cal'); }); }); F.sel = {}; toast(n + ' shift' + (n === 1 ? '' : 's') + ' updated for ' + ids.length + ' driver' + (ids.length === 1 ? '' : 's'), 'ok'); render(); };
UI.shCopy = () => { const a = weekDays(0), b = weekDays(1); let n = 0; J.tx(s => { a.forEach((x, k) => { s.roster[b[k].key] = Object.assign({}, s.roster[x.key] || {}); n++; }); }); A.ui.sh.w = 1; toast('This week copied to next week', 'ok'); render(); };
UI.shTimes = () => modal('<h2>Shift timings</h2><p class="small muted" style="margin:0">Changes apply to all rosters and show in the driver app.</p>' + J.S.shifts.map(s => '<div class="row" style="flex-wrap:nowrap"><b style="width:80px">' + s.name + '</b><input class="in" type="time" id="sf_' + s.id + '" value="' + s.from + '"><span class="muted">to</span><input class="in" type="time" id="st_' + s.id + '" value="' + s.to + '"></div>').join('') + '<div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.closeModal()">Cancel</button><button class="btn pri" onclick="UI.shTimesSave()">Save</button></div>');
UI.shTimesSave = () => { J.tx(s => s.shifts.forEach(x => { x.from = document.getElementById('sf_' + x.id).value || x.from; x.to = document.getElementById('st_' + x.id).value || x.to; })); closeModal(); toast('Shift timings saved', 'ok'); render(); };
UI.shExp = () => { const F = A.ui.sh, days = weekDays(F.w); const ds = scopeD().filter(d => F.area === 'All' || d.site === F.area); exportTable('Shift roster ' + days[0].key, ['Driver', 'Employee ID', 'Area'].concat(days.map(x => x.d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }))).concat(['Hours']), ds.map(d => [d.name, d.emp, J.SITES[d.site].short].concat(days.map(x => SH_LBL[shGet(x.key, d.id)] || shGet(x.key, d.id))).concat([days.reduce((a, x) => a + shHours(shGet(x.key, d.id)), 0)])), 'xls'); toast('Excel file downloaded', 'ok'); };

</script></body></html>
